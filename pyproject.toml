[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "puedobot"
version = "0.1.0"
description = "AI-Augmented SAST Security Auditor"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-openai>=0.2.0",
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "sqlalchemy>=2.0.30,<2.1.0",
    "psycopg2-binary>=2.9.9",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "bandit>=1.8.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
semgrep = [
    "semgrep>=1.60.0",
]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
puedobot = "app.cli.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: tests that make live outbound network requests (deselect with '-m \"not network\"')",
]